name: Deploy static build to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'helium_spectra_calc.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Resolves the base path Pages will serve this under
      - uses: actions/configure-pages@v5

      # The same script used for any other static host, so there is one
      # definition of what the deployed directory contains.
      - name: Assemble the site
        run: |
          sh web/deploy.sh _site
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
